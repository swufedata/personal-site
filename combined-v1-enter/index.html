<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组合动态版 · 使用 oil-motion skill</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" id="stage">
    <img class="layer layer--bg" src="assets/background.png" alt="">
    <div class="layer layer--char" id="char" aria-hidden="true"></div>
    <div class="layer layer--text" id="text" aria-hidden="true"></div>
    <div class="enter" id="enter">
      <img class="enter__img" src="assets/buttons/enter.png" alt="进入">
    </div>
    <div class="menu" id="menu">
      <img class="menu__btn menu__btn--resume" src="assets/buttons/resume.png" alt="resume">
      <img class="menu__btn menu__btn--demo" src="assets/buttons/demo.png" alt="demo">
      <img class="menu__btn menu__btn--photography" src="assets/buttons/photography.png" alt="photography">
    </div>
    <div class="hint" id="hint">加载中…</div>
  </main>
  <script src="assets/interactive-motion.js"></script>
  <script src="app.js"></script>
</body>
</html>

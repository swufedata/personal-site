<body>
  <div class="page">
    <main class="stage" id="stage">
      <div class="scene" id="scene">
        <div class="scene__breathe">
          <canvas class="scene__canvas" id="scene-canvas" aria-hidden="true"></canvas>
        </div>
      </div>

      <div class="accents" id="accents" aria-hidden="true">
        <i class="spark spark--a"></i>
        <i class="spark spark--b"></i>
        <i class="spark spark--c"></i>
        <i class="spark spark--d"></i>
        <i class="spark spark--e"></i>
        <i class="planet"></i>
        <i class="glow"></i>
      </div>

      <div class="hud" id="hud">
        <div class="hud__row">
          <span class="hud__label">Loading my space...</span>
          <span class="hud__pct" id="hud-pct">0%</span>
        </div>
        <div class="hud__track">
          <div class="hud__fill" id="hud-fill"></div>
        </div>
      </div>

      <div class="ink" aria-hidden="true"></div>
    </main>
  </div>

  <div class="grain" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
